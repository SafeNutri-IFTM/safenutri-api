name: Deploy Backend Safenutri (Docker Image via SCP)

on:
  push:
    branches:
      - SN-218

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Cache do Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Construir a imagem Docker
        run: |
          docker build -t safenutri-api:latest .

      - name: Salvar imagem em arquivo tar
        run: docker save safenutri-api:latest -o safenutri-api.tar

      - name: Copiar imagem para a VM2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM2_IP }}
          username: ${{ secrets.VM2_USERNAME }}
          key: ${{ secrets.VM2_SSH_KEY }}
          source: "safenutri-api.tar"
          target: "/home/ubuntu/safenutri-api/"

      - name: Deploy e cópia das imagens
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM2_IP }}
          username: ${{ secrets.VM2_USERNAME }}
          key: ${{ secrets.VM2_SSH_KEY }}
          script: |
            cd /home/ubuntu/safenutri-api

            # Carrega a nova imagem
            docker load -i safenutri-api.tar
            rm safenutri-api.tar

            # Cria as pastas de upload (se não existirem)
            mkdir -p uploads/receitas uploads/nutricionistas
            sudo chmod -R 777 uploads

            # Para e remove containers antigos (preserva volumes)
            docker compose down

            # Sobe os containers (a API vai subir, mas as pastas de upload estão vazias)
            docker compose up -d

            # Aguarda o container da API ficar pronto (sleep simples)
            sleep 5

            # Copia as imagens padrão do container para os volumes
            # (se as pastas estiverem vazias, copia; se já tiver imagens, não sobrescreve)
            docker exec safenutri-api sh -c "if [ -z \"\$(ls -A /app/uploads/receitas 2>/dev/null)\" ]; then cp -r /app/uploads_default/receitas/* /app/uploads/receitas/; fi"
            docker exec safenutri-api sh -c "if [ -z \"\$(ls -A /app/uploads/nutricionistas 2>/dev/null)\" ]; then cp -r /app/uploads_default/nutricionistas/* /app/uploads/nutricionistas/; fi"

            # Reinicia a API para garantir que as imagens sejam servidas (opcional)
            docker compose restart api