name: Deploy Backend Safenutri (Docker)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar arquivos para a VM2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM2_IP }}
          username: ${{ secrets.VM2_USERNAME }}
          key: ${{ secrets.VM2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/safenutri-api"
          strip_components: 0

      - name: Executar docker compose na VM (back)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM2_IP }}
          username: ${{ secrets.VM2_USERNAME }}
          key: ${{ secrets.VM2_SSH_KEY }}
          script: |
            cd /home/ubuntu/safenutri-api
            docker compose down -v   # remove volumes antigos
            docker compose up -d --build