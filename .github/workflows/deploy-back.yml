name: Deploy Backend Safenutri

on:
  push:
    branches:
      - dev # Quando for para produção, é só trocar para main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build do arquivo JAR (Maven)
        run: mvn clean package -DskipTests

      - name: Copiar o arquivo JAR para a VM2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM2_IP }}
          username: ${{ secrets.VM2_USERNAME }}
          key: ${{ secrets.VM2_SSH_KEY }}
          source: "target/*.jar" 
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Reiniciar a API no Linux
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM2_IP }}
          username: ${{ secrets.VM2_USERNAME }}
          key: ${{ secrets.VM2_SSH_KEY }}
          script: |
            echo "Reiniciando a API e deixando o Flyway fazer a mágica..."
            sudo systemctl restart safenutri-api